<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1F44" />
      <stop offset="100%" stop-color="#103067" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89C849" />
      <stop offset="100%" stop-color="#6AA135" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded box for sharp visibility on all tab themes -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="480" height="480" x="16" y="16" rx="96" fill="none" stroke="#7BB643" stroke-opacity="0.3" stroke-width="8" />

  <!-- Mythron 'M' Molecular Precision Emblem -->
  <g filter="url(#glow)">
    <!-- Left Column -->
    <path d="M 128 384 L 128 160 C 128 142 142 128 160 128 L 168 128 C 186 128 200 142 200 160 L 200 384 C 200 393 193 400 184 400 L 144 400 C 135 400 128 393 128 384 Z" fill="url(#greenGrad)" />

    <!-- Center Diagonal Vertex (Right & Left Slanted Bars) -->
    <path d="M 184 144 L 256 260 L 328 144 C 336 131 352 131 360 144 L 384 184 C 392 197 386 214 372 220 L 276 348 C 266 361 246 361 236 348 L 140 220 C 126 214 120 197 128 184 Z" fill="#FFFFFF" />

    <!-- Right Column -->
    <path d="M 312 384 L 312 160 C 312 142 326 128 344 128 L 352 128 C 370 128 384 142 384 160 L 384 384 C 384 393 377 400 368 400 L 328 400 C 319 400 312 393 312 384 Z" fill="url(#greenGrad)" />
    
    <!-- Molecular Precision Accent Dot -->
    <circle cx="256" cy="380" r="24" fill="url(#greenGrad)" />
  </g>
</svg>
